:root {

html, body {

/* ── Fond quadrillé stylé : grille technique + halos lumineux ──────── */
.grid-background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-color: var(--bg-deep);
    background-image:
        linear-gradient(rgba(56, 189, 248, 0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.10) 1px, transparent 1px),
        linear-gradient(rgba(56, 189, 248, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.045) 1px, transparent 1px);
    background-size: 90px 90px, 90px 90px, 18px 18px, 18px 18px;
    background-position: -1px -1px;
    animation: gridDrift 22s linear infinite;
}

@keyframes gridDrift {
    0%   { background-position: 0 0, 0 0, 0 0, 0 0; }
    100% { background-position: 90px 90px, 90px 90px, 18px 18px, 18px 18px; }
}

.grid-vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(ellipse 900px 600px at 15% -5%, rgba(56,189,248,0.22), transparent 60%),
        radial-gradient(ellipse 700px 500px at 110% 15%, rgba(14,165,233,0.18), transparent 60%),
        radial-gradient(ellipse 900px 700px at 50% 120%, rgba(56,189,248,0.14), transparent 60%),
        radial-gradient(circle at center, transparent 30%, var(--bg-deep) 92%);
}

@media (prefers-reduced-motion: reduce) {
    .grid-background { animation: none; }
}

/* ── Audio control flottant ──────────────────────────────────────── */
.audio-toggle {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 80;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--sky-dim), #2563eb);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 10px 30px rgba(56,189,248,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 21px;
    color: #04101f;
    transition: transform 0.2s ease;
}

.audio-toggle:hover { transform: scale(1.08); }
.audio-toggle.muted { background: var(--bg-panel); color: var(--ink-dim); border-color: var(--line); box-shadow: none; }

.audio-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
}
.audio-bars span {
    width: 3px;
    background: #04101f;
    border-radius: 2px;
    animation: barBounce 0.9s infinite ease-in-out;
}
.audio-bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
.audio-bars span:nth-child(2) { height: 100%; animation-delay: 0.15s; }
.audio-bars span:nth-child(3) { height: 65%; animation-delay: 0.3s; }
.audio-toggle.muted .audio-bars span { animation-play-state: paused; background: var(--ink-dim); height: 30% !important; }

@keyframes barBounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
}

<script>
// ════════════════════════════════════════════════════════════════════════
//  audio.js — sélectionne une musique aléatoire à chaque ouverture de page
//  et la joue dès le premier clic de l'utilisateur (politique autoplay des
//  navigateurs : le son ne peut démarrer qu'après une interaction).
// ════════════════════════════════════════════════════════════════════════
(function () {
    const TRACKS = [
        'https://files.catbox.moe/ln2rfn.mp3',
        'https://files.catbox.moe/3f5n04.mp3',
        'https://files.catbox.moe/h4w0ci.mp3',
        'https://files.catbox.moe/cevgme.mp3',
        'https://files.catbox.moe/j5i96j.mp3',
        'https://files.catbox.moe/682sf0.mp3',
        'https://files.catbox.moe/z1a9xz.mp3',
        'https://files.catbox.moe/ialmg6.mp3',
        'https://files.catbox.moe/zb7luw.aac',
    ];

    const track = TRACKS[Math.floor(Math.random() * TRACKS.length)];

    const audio = new Audio(track);
    audio.loop = true;
    audio.volume = 0.55;
    audio.preload = 'auto';

    let started = false;
    let muted = false;

    function buildToggle() {
        const btn = document.createElement('div');
        btn.className = 'audio-toggle muted';
        btn.id = 'audioToggle';
        btn.title = 'Activer / couper la musique';
        btn.innerHTML = `
            <div class="audio-bars">
                <span></span><span></span><span></span>
            </div>`;
        document.body.appendChild(btn);
        return btn;
    }

    function startAudio() {
        if (started) return;
        started = true;
        audio.play().catch(() => {
            // L'autoplay a pu être bloqué malgré le clic ; on réessaiera au prochain geste
            started = false;
        });
        const btn = document.getElementById('audioToggle');
        if (btn) btn.classList.remove('muted');
    }

    function toggleAudio(e) {
        e.stopPropagation();
        if (!started) { startAudio(); return; }
        muted = !muted;
        audio.muted = muted;
        const btn = document.getElementById('audioToggle');
        if (btn) btn.classList.toggle('muted', muted);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const btn = buildToggle();
        btn.addEventListener('click', toggleAudio);

        // Premier clic n'importe où sur la page = démarre la musique automatiquement
        const onFirstInteract = () => {
            startAudio();
            document.removeEventListener('click', onFirstInteract);
        };
        document.addEventListener('click', onFirstInteract);
    });
})();

</script>
